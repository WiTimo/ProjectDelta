[package]
name = "rust_preprocessor"
version = "0.1.0"
edition = "2021"
authors = ["ProjectDelta"]
description = "High-performance NQ tick data preprocessor with LOB reconstruction and microstructure features"

[dependencies]
# CLI and config
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"

# Data processing
csv = "1.3"
polars = { version = "0.36", features = ["parquet", "lazy", "dtype-datetime"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1.33", features = ["serde"] }

# Parallelism
rayon = "1.8"
crossbeam = "0.8"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Memory efficiency
memmap2 = "0.9"
bstr = "1.9"

# Statistics
statrs = "0.16"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
